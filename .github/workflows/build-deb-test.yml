name: Build Linux DEB (test artifact only)
on:
  push:
    branches: ['test/deb-auto-detect-ai']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Build UI
        run: npm run build:web
      - name: Build Debian package
        run: npx electron-builder --linux deb --x64 --publish never
      - name: Verify Debian package
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(release/*.deb)
          test "${#packages[@]}" -gt 0
          for pkg in "${packages[@]}"; do
            dpkg-deb --info "$pkg"
            dpkg-deb --contents "$pkg" | grep -q 'hearth-ai-command-center'
            test "$(stat -c%s "$pkg")" -gt 50000000
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Hearth-AI-Command-Center-DEB-test
          path: release/*.deb
          if-no-files-found: error
          retention-days: 30
