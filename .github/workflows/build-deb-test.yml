name: Build Linux DEB (test artifact only)

# Builds a test .deb and uploads it as a workflow artifact. Never creates or
# publishes a GitHub Release.
on:
  push:
    branches: ['test/deb-auto-detect-ai', 'feature/next-team', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Build UI
        run: npm run build:web
      - name: Build Debian package
        run: npx electron-builder --linux deb --x64 --publish never
      - name: Verify Debian package
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(release/*.deb)
          test "${#packages[@]}" -gt 0
          for pkg in "${packages[@]}"; do
            dpkg-deb --info "$pkg"
            dpkg-deb --contents "$pkg" > /tmp/hearth-deb-contents.txt
            grep -q 'hearth-ai-command-center' /tmp/hearth-deb-contents.txt
            test "$(stat -c%s "$pkg")" -gt 50000000
          done
      - name: Checksums cover the .deb (what in-app .deb updates verify against)
        run: |
          set -euo pipefail
          (cd release && sha256sum *.deb) | tee release/SHA256SUMS.txt
          grep -qE '^[0-9a-f]{64}  .*\.deb$' release/SHA256SUMS.txt
          node -e "const u=require('./electron/updater-deb.cjs');const fs=require('fs');const s=u.parseSums(fs.readFileSync('release/SHA256SUMS.txt','utf8'));const f=fs.readdirSync('release').find(x=>x.endsWith('.deb'));const r=u.verify(fs.readFileSync('release/'+f),f,s);if(!r.ok){console.error(r.message);process.exit(1)}console.log('verified',f)"
      - uses: actions/upload-artifact@v4
        with:
          name: Hearth-AI-Command-Center-DEB-test
          path: release/*.deb
          if-no-files-found: error
          retention-days: 30
