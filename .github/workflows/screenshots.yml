name: UI screenshots (CI only)

# Renders the app's UI with fake data and saves PNGs. Never builds a release.
on:
  push:
    branches: ['ci/screenshots', 'feature/next-team', 'feature/**', 'release/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check vendored three.js against the npm tarball
        run: |
          mkdir -p /tmp/three && cd /tmp/three
          npm pack three@0.170.0 --silent > name.txt
          [ "$(sha512sum "$(cat name.txt)" | cut -d' ' -f1 | xxd -r -p | base64 -w0)" = "FQK+LEpYc0fBD+J8g6oSEyyNzjp+Q7Ks1C568WWaoMRLW+TkNNWmenWeGgJjV105Gd+p/2ql1ZcjYvNiPZBhuQ==" ]
          tar -xzf "$(cat name.txt)" package/build/three.module.min.js
          cmp package/build/three.module.min.js "$GITHUB_WORKSPACE/src/vendor/three/three.module.min.js"
          echo "three.js matches the npm tarball"

      - name: Build web UI
        run: npx vite build

      - name: Install Playwright (CI only, not saved to package.json)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Take screenshots
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          mkdir -p shots
          set +e
          OUT_DIR=shots node ci/screenshots/shoot.mjs 2>&1 | tee shots/log.txt
          status=${PIPESTATUS[0]}
          # Team ops screens (summary, budget, CI failure, projects, logs, phone).
          OUT_DIR=shots node ci/screenshots/shoot-ops.mjs 2>&1 | tee -a shots/log.txt
          ops_status=${PIPESTATUS[0]}
          [ "$status" -ne 0 ] || status=$ops_status
          # Team workflow screens (truth card, refused action, review packet, release gate, jobs, blockers).
          OUT_DIR=shots node ci/screenshots/shoot-workflow.mjs 2>&1 | tee -a shots/log.txt
          wf_status=${PIPESTATUS[0]}
          [ "$status" -ne 0 ] || status=$wf_status
          set -e
          ls -la shots
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: shots/*.png
          if-no-files-found: error

      - name: Commit screenshots to ci/screenshots-out (orphan branch)
        if: always()
        run: |
          src_sha=$(git rev-parse --short HEAD)
          mkdir /tmp/out && cp shots/*.png shots/log.txt /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b ci/screenshots-out
          git config user.name Dragongamer9
          git config user.email Dragongamer9@users.noreply.github.com
          git add -A
          git commit -q -m "UI screenshots from ${src_sha}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci/screenshots-out
