# One-time: point the old release tags at the same commits with only Dragongamer9 as author (no AI attribution lines).
# The clean history is on the branch rewrite/clean-tags. Run by hand (Actions › Move old tags › Run workflow); removed afterwards.
name: Move old tags
on: workflow_dispatch
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Move the tags to the clean commits
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cat > map.txt <<'MAP'
          220b841ccdccc629d8e4e682929e5650c6131520 v0.2.0
          af8ca709f1f627e0a44b67eb9650a610645a7689 v0.3.0
          4fcb49559e6a12fc98db8fd8df6d2f703bde17fa v0.4.0
          MAP
          git init -q t && cd t
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --filter=blob:none origin +refs/heads/rewrite/clean-tags:refs/remotes/origin/clean
          awk 'NF==2{print "+"$1":refs/tags/"$2}' ../map.txt | xargs -n 40 git push -q origin
          bad=0; while read sha tag; do [ -z "$sha" ] && continue; now=$(git ls-remote origin "refs/tags/$tag" | cut -f1); [ "$now" = "$sha" ] || { echo "::error::$tag is $now, not $sha"; bad=1; }; done < ../map.txt
          [ $bad = 0 ] || exit 1
          echo "::notice title=Tags moved::$(grep -c . ../map.txt) tags now point at the clean commits"
          git push -q origin --delete rewrite/clean-tags
